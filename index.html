<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hortlog</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6efec;--card:#fbfdfc;--ink:#0b1f20;--soft:#4d6665;--deep:#0f3d3e;--hot:#ff6b2c;--sun:#ffd23f;--map:#d4e3de;--blk:#f4faf8;--psa:#e03131;--dead:#1c7ed6;--buy:#e6a700;--note:#6b8a86;--todo:#7c4dff;--crew:#0a9c82;--spray:#a0643a;--bio:#3a9d23;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1718;--card:#122a2b;--ink:#e6f2ef;--soft:#8fb0ac;--deep:#1d6b6c;--map:#0f2223;--blk:#16312f;--psa:#ff6b5e;--dead:#5aa9f5;--buy:#ffc933;--note:#8fb0ac;--todo:#a98bff;--crew:#3fd1b5;--spray:#d29a6e;--bio:#7fd05a}}
:root[data-theme="dark"]{--bg:#0a1718;--card:#122a2b;--ink:#e6f2ef;--soft:#8fb0ac;--deep:#1d6b6c;--map:#0f2223;--blk:#16312f;--psa:#ff6b5e;--dead:#5aa9f5;--buy:#ffc933;--note:#8fb0ac;--todo:#a98bff;--crew:#3fd1b5;--spray:#d29a6e;--bio:#7fd05a}
*{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 17px/1.35 Barlow,system-ui,sans-serif;max-width:560px;margin:0 auto}
h1,h2,.hd{font-family:'Barlow Condensed',Impact,sans-serif;text-transform:none;letter-spacing:.01em}
.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
header{background:var(--deep);color:#fff;padding:14px 18px 0;position:sticky;top:0;z-index:4}
.top{display:flex;justify-content:space-between;align-items:flex-end}
h1{margin:0;font-size:36px;font-weight:800;line-height:1}
h1 i{font-style:normal;color:var(--sun)}
.top span{font:600 15px 'Barlow Condensed',sans-serif;color:#cfe8e3;padding-bottom:4px}
.tabs{display:flex;gap:0;margin-top:12px;margin-left:-6px}
.tab{flex:1;border:0;background:#0a2c2d;color:#9fc5c0;font:800 22px 'Barlow Condensed',sans-serif;padding:12px 0 12px 18px;min-height:50px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%,14px 50%);margin-right:-12px;text-align:center}
.tab.on{background:var(--hot);color:#1a0d05;z-index:1}
.tab:last-child{margin-right:0}
main{padding:14px 14px 190px}
.next{background:var(--sun);color:#1c1600;padding:14px 18px 14px 16px;display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;font:600 17px Barlow,sans-serif}
.next b{font:800 24px/1 'Barlow Condensed',sans-serif;display:block}
.next .ar{font:800 30px 'Barlow Condensed';margin-left:auto}
.bar{display:flex;gap:3px;margin:12px 0 4px}
.bar i{flex:1;height:10px;background:var(--map);transform:skewX(-25deg)}
.bar i.f{background:var(--hot)}
.cap{font:600 14px Barlow;color:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;border:0;background:var(--card);color:var(--ink);font:800 18px 'Barlow Condensed',sans-serif;padding:9px 16px 9px 12px;min-height:44px;display:flex;gap:8px;align-items:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.chip.on{background:var(--ink);color:var(--bg)}
.sq{width:12px;height:12px;display:inline-block;flex:none;transform:rotate(45deg)}
svg.m{width:100%;height:auto;display:block;background:var(--map)}
.blk{fill:var(--blk)}.bl{fill:var(--soft);font:800 15px 'Barlow Condensed',sans-serif}
.pin{stroke:var(--bg);stroke-width:2;cursor:pointer}.pin.done{opacity:.28}
.card{background:var(--card);padding:6px 16px 8px 20px;margin-top:14px;position:relative}
.card h2{margin:8px 0 2px;font-size:26px;font-weight:800;display:flex;gap:10px;align-items:center}
.card h2 em{margin-left:auto;font:600 16px Barlow;color:var(--soft);font-style:normal}
.stripe{position:absolute;left:0;top:0;bottom:0;width:7px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px dashed var(--map)}
.row.first{border-top:0}
.row .t{flex:1;font-weight:600}.row small{display:block;color:var(--soft);font-size:14px;font-weight:500}
.row.done .t{text-decoration:line-through;opacity:.45}
.tick{width:36px;height:36px;border:3px solid var(--deep);background:none;color:transparent;font:800 20px sans-serif;flex:none;transform:skewX(-8deg)}
.done .tick{background:var(--hot);border-color:var(--hot);color:#1a0d05}
.x{background:none;border:0;color:var(--soft);font-size:22px;min-width:44px;min-height:44px}
.empty{color:var(--soft);padding:8px 0 12px}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;font:600 17px Barlow,sans-serif;padding:13px;border:3px solid var(--deep);background:var(--bg);color:var(--ink);border-radius:0}
.hint{color:var(--soft);font-size:15px;margin:10px 2px}
#log{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);z-index:5}
#mic{width:100%;border:0;background:var(--hot);color:#1a0d05;min-height:62px;font:800 26px 'Barlow Condensed',sans-serif;display:flex;align-items:center;justify-content:center;gap:14px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
#mic svg{width:30px;height:30px;fill:currentColor}
#mic.live{background:var(--psa);color:#fff;background-image:repeating-linear-gradient(-45deg,transparent 0 12px,rgba(255,255,255,.18) 12px 24px);background-size:34px 34px;animation:go .8s linear infinite}
@keyframes go{to{background-position:34px 0}}
@media (prefers-reduced-motion:reduce){#mic.live{animation:none}}
#toast{position:fixed;left:14px;right:14px;max-width:532px;margin:0 auto;bottom:calc(176px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:13px 16px;display:none;gap:12px;align-items:center;z-index:6;font-weight:600}
#toast span{flex:1}#toast button{background:none;border:0;color:var(--sun);font:800 20px 'Barlow Condensed',sans-serif;min-height:40px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tab{font-size:20px;padding-left:16px}
.lr{display:flex;gap:10px}
#mic{flex:1;width:auto}
#cam{width:76px;border:0;background:var(--sun);color:#1c1600;display:grid;place-items:center;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
#cam svg{width:32px;height:32px;fill:currentColor}
.recb{border:2px solid #9fc5c0;background:none;color:#cfe8e3;font:800 17px 'Barlow Condensed',sans-serif;padding:3px 10px;margin-left:6px;min-height:36px}
.thumb{width:64px;height:64px;object-fit:cover;display:block;margin-top:8px}
.btn{border:0;background:var(--deep);color:#fff;font:800 20px 'Barlow Condensed',sans-serif;padding:12px 20px;min-height:46px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.x{min-width:40px}
.qr{display:flex;gap:8px;margin-bottom:8px}
#q{flex:1;background:var(--card);min-width:0}
#go{width:62px;border:0;background:var(--deep);color:#fff;font:800 30px 'Barlow Condensed',sans-serif}
.dn{display:flex;align-items:center;justify-content:space-between;background:var(--deep);color:#fff;padding:4px 6px}
.dn .hd{font-size:28px;font-weight:800}.dn .x{color:#fff;font-size:30px;min-width:56px;min-height:52px}
.tip{background:var(--sun);color:#1c1600;padding:12px 46px 12px 14px;position:relative;margin-bottom:12px;font-weight:600}
.tip button{position:absolute;right:0;top:0;background:none;border:0;font:800 22px sans-serif;color:inherit;min-width:46px;min-height:46px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);color:var(--ink);border:0;text-align:left;padding:12px 14px;font:600 16px Barlow,sans-serif;min-height:92px;width:100%;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.tile b{font:800 26px 'Barlow Condensed',sans-serif;display:block;margin-bottom:4px}
.dbtn{border:3px solid var(--deep);background:none;color:var(--ink);font:800 17px 'Barlow Condensed',sans-serif;padding:6px 12px;min-height:46px;flex:none}
.row.done .dbtn{background:var(--hot);border-color:var(--hot);color:#1a0d05}
.back{background:none;border:0;color:var(--ink);font:800 22px 'Barlow Condensed',sans-serif;padding:8px 0;min-height:46px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 8px}
a.btn{display:inline-block;text-decoration:none;line-height:22px}
svg.img{touch-action:manipulation}
#ob{position:fixed;inset:0;background:rgba(5,20,20,.93);z-index:9;display:flex;align-items:center;justify-content:center;padding:20px}
#ob .box{background:var(--card);color:var(--ink);max-width:420px;width:100%;padding:24px 22px}
#ob h2{font-size:34px;margin:12px 0 8px;font-weight:800}#ob p{margin:0 0 20px;font-size:19px}
.obn{display:flex;justify-content:space-between;align-items:center}
.btn[disabled]{opacity:.35}
.dots i{display:inline-block;width:22px;height:6px;background:var(--map);margin-right:5px;transform:skewX(-25deg)}.dots i.on{background:var(--hot)}
.blk,.bl{cursor:pointer}
.bl.li{fill:#fff;stroke:#000;stroke-width:3px;paint-order:stroke}
.btn.alt{background:none;border:3px solid var(--deep);color:var(--ink)}
@keyframes pop{0%{opacity:.25;transform:translateY(-46px);background:var(--sun)}60%{background:var(--sun)}100%{opacity:1;transform:none;background:transparent}}
.row.pop{animation:pop .8s ease-out}
@keyframes drop{0%{transform:translateY(-240px);opacity:.3}100%{transform:none;opacity:1}}
.card.drop{animation:drop .7s ease-out}
@media (prefers-reduced-motion:reduce){.row.pop,.card.drop{animation:none}}
@media (min-width:900px){body{max-width:980px}#log{max-width:none}#toast{max-width:940px}.tiles{grid-template-columns:repeat(4,1fr)}}
.ban{display:flex;align-items:center;justify-content:space-between;width:100%;height:76px;border:0;color:#fff;background-size:cover;background-position:center;padding:0 16px;margin:4px 0 8px;font:800 22px 'Barlow Condensed',sans-serif}
#auth{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}
#auth .box{background:var(--card);padding:26px 22px;max-width:420px;width:100%}
#auth h2{font:800 46px 'Barlow Condensed',sans-serif;margin:0 0 6px}#auth h2 i{font-style:normal;color:var(--hot)}#auth p{margin:0 0 14px}
#hb{background:var(--sun);color:#1c1600;border:0;width:38px;height:38px;padding:0;font:800 20px 'Barlow Condensed',sans-serif;margin-left:6px}
#cap{position:fixed;inset:0;background:rgba(5,20,20,.93);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
#cap .box{background:var(--card);color:var(--ink);max-width:420px;width:100%;padding:16px}
#cap h2{font-size:28px;margin:10px 0 8px;font-weight:800}.capimg{width:100%;max-height:34vh;object-fit:cover;display:block}
#plus{display:none}

body{max-width:none;margin:0;font-size:15px}
header{padding:10px 24px 0}h1{font-size:28px}
.tab{font-size:17px;min-height:38px;padding:8px 0 8px 14px}
main{padding:16px 24px 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:0 18px;align-items:start}

.card{margin-top:10px}.card h2{font-size:21px}
.chip{min-height:34px;font-size:16px;padding:5px 14px 5px 10px}
.next{padding:10px 16px}.next b{font-size:20px}
.thumb{width:48px;height:48px}.btn{min-height:38px;font-size:17px;padding:8px 16px}.ban{height:56px}
#plus{display:grid;place-items:center;position:fixed;right:24px;bottom:24px;width:52px;height:52px;border:0;background:var(--hot);color:#1a0d05;font:800 34px/1 'Barlow Condensed',sans-serif;z-index:6;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
#log{display:none;left:auto;right:24px;bottom:88px;width:420px;max-width:none;margin:0;padding:12px;background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.25)}
#log.open{display:block}#log .lr{display:none}#log .qr{margin:0}
#toast{left:24px;right:auto;bottom:24px;max-width:460px;margin:0}
}
.big{font:800 80px/1 'Barlow Condensed',sans-serif;color:var(--hot)}
label input[type=number]{width:96px;margin-left:6px;padding:8px}
label{font-weight:600}
#setup{position:fixed;inset:0;background:rgba(5,20,20,.93);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
#setup .box{background:var(--card);color:var(--ink);max-width:420px;width:100%;padding:22px}

.stats,.feed{display:none}

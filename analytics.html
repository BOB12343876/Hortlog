<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Hortlog analytics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@800&display=swap">
<style>*{box-sizing:border-box}:root{--bg:#E6EFEC;--card:#FBFDFC;--ink:#0B1F20;--soft:#4D6665;--line:#D4E3DE;--deep:#0F3D3E;--hot:#FF6B2C;--sun:#FFD23F;--bar:#0A9C82}
@media(prefers-color-scheme:dark){:root{--bg:#0A1718;--card:#122A2B;--ink:#E6F2EF;--soft:#9DB8B3;--line:#1D6B6C}}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Barlow,system-ui,sans-serif}.top{background:var(--deep);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lg{font:800 30px/1 'Barlow Condensed',Impact,sans-serif;color:#fff}.lg i{font-style:normal;color:var(--sun)}.lg small{font:600 15px Barlow,sans-serif;color:#cfe0db;margin-left:10px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 50px}h2{font:800 28px/1.1 'Barlow Condensed',Impact,sans-serif;margin:26px 0 8px}
.rng button,.btn{font:600 16px Barlow,sans-serif;border:2px solid var(--sun);background:transparent;color:#fff;padding:7px 14px;cursor:pointer;margin-left:6px}.rng button.on{background:var(--sun);color:#0B1F20}.btn{background:var(--hot);border-color:var(--hot);margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tile{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--hot);padding:12px 14px}.tile b{display:block;font:800 40px/1 'Barlow Condensed',sans-serif}.tile span{color:var(--soft);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);padding:14px;overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--soft);font-weight:600;font-size:14px}
.bar{display:inline-block;height:12px;background:var(--bar);vertical-align:middle;min-width:2px}.hot{background:var(--hot)}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.note{color:var(--soft);font-size:14px;margin:6px 0 0}#login{max-width:380px;margin:50px auto;background:var(--card);border:1px solid var(--line);padding:20px}input{width:100%;font:inherit;padding:10px;margin:6px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.err{color:#E03131;font-weight:600}</style></head><body>
<div class="top"><span class="lg">Hort<i>log</i><small>Analytics</small></span><span class="rng" id="rng"></span></div>
<main id="m"><p class="note">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://hqarztbbnayyjlpzyufp.supabase.co','sb_publishable_vqne2DRPo3bKcQRj79pYug_ZbXiEgfl');
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let days=30;
const NAMES={slide_alert:'Home slide: Spray alert',slide_audit:'Home slide: Audit time',slide_month:'Home slide: Month so far',slide_sign:'Home slide: Sign on your team',slide_team:'Home slide: Invite your team',slide_jobs:'Home slide: Jobs to do',slide_problems:'Home slide: PSA and dead vines',slide_dot:'Home slide: dots tapped',nudge_setup:'Setup bar: Do this now',nudge_setup_hide:'Setup bar: Hide',nudge_team:'Invite your team banner',nudge_team_dismiss:'Invite your team: dismissed',nudge_install:'Install bar',install_click:'Install button (Settings or pop-up)',feedback_open:'Send feedback opened'};
const EV={log_add:'Entries logged',export:'Exports (Excel or PDF)',sign_link_created:'Signing links created',sign_link_shared:'Signing links shared',sign_group_started:'In person sheets started',sign_group_signature:'In person signatures',sign_group_finished:'In person sheets finished',sign_deleted:'Signing items deleted',feedback_sent:'Feedback sent',pwa_installed:'App installed'};
function bars(rows,key,val,cls){const mx=Math.max(1,...rows.map(r=>r[val]));return rows.map(r=>`<tr><td>${esc(r.label||r[key])}</td><td>${r[val]}</td><td><span class="bar ${cls||''}" style="width:${Math.round(r[val]/mx*180)}px"></span></td></tr>`).join('')}
function daily(d){if(!d.length)return '<p class="note">No data yet.</p>';const W=Math.max(320,d.length*22),H=150,mx=Math.max(1,...d.map(x=>x.users)),bw=Math.max(6,Math.min(18,(W-20)/d.length-4));
return `<svg viewBox="0 0 ${W+20} ${H+34}" style="width:100%;max-width:${W+20}px;min-width:320px"><g>${d.map((x,i)=>{const h=Math.round(x.users/mx*H),px=10+i*((W-20)/d.length);return `<rect x="${px}" y="${H-h+6}" width="${bw}" height="${h}" fill="#0A9C82"><title>${x.d}: ${x.users} users, ${x.events} events</title></rect>`+(d.length<=16||i%Math.ceil(d.length/10)===0?`<text x="${px}" y="${H+22}" font-size="10" fill="currentColor" opacity=".7">${x.d.slice(5)}</text>`:'')}).join('')}</g></svg><p class="note">Bars show how many different people used Hortlog each day.</p>`}
async function load(){const r=await sb.rpc('analytics_summary',{p_days:days});if(r.error){$('#m').innerHTML='<div class="card"><h2 style="margin-top:0">Not available</h2><p>'+(/Not allowed/i.test(r.error.message)?'This page is only for the Hortlog owner. You are logged in as an account that is not on the list.':esc(r.error.message)+'<br>If you have not yet run hortlog-analytics.sql in Supabase, do that first.')+'</p></div>';return}
const s=r.data,t=s.totals,stick=s.mau?Math.round(s.wau/s.mau*100):0;
const cta=s.cta.map(c=>({...c,label:NAMES[c.id]||c.id,ctr:c.shown?Math.round(c.clicks/c.shown*100):null}));
$('#m').innerHTML=`<div class="tiles"><div class="tile"><b>${t.users}</b><span>people active</span></div><div class="tile"><b>${t.opens}</b><span>app opens</span></div><div class="tile"><b>${t.sessions}</b><span>visits</span></div><div class="tile"><b>${t.events}</b><span>actions recorded</span></div><div class="tile"><b>${s.wau}</b><span>active this week</span></div><div class="tile"><b>${s.mau}</b><span>active this month</span></div><div class="tile"><b>${stick}%</b><span>weekly / monthly</span></div></div>
<h2>People per day</h2><div class="card">${daily(s.daily)}</div>
<h2>Click-through rates</h2><div class="card"><table><tr><th>What people saw</th><th>Shown</th><th>Clicked</th><th>Click-through</th><th></th><th>People who clicked</th></tr>${cta.map(c=>`<tr><td>${esc(c.label)}</td><td>${c.shown}</td><td>${c.clicks}</td><td><b>${c.ctr===null?'-':c.ctr+'%'}</b></td><td>${c.ctr===null?'':`<span class="bar hot" style="width:${Math.min(180,c.ctr*1.8)}px"></span>`}</td><td>${c.users}</td></tr>`).join('')||'<tr><td colspan="6">Nothing recorded yet.</td></tr>'}</table><p class="note">Click-through = clicks divided by times shown. A slide is counted once a minute at most, so quick rotations do not inflate it.</p></div>
<div class="two"><div><h2>What people do</h2><div class="card"><table>${bars(s.features.map(f=>({...f,label:EV[f.event]||f.event})),'event','count')||''}</table></div></div>
<div><h2>Screens visited</h2><div class="card"><table>${bars(s.views.map(v=>({...v,label:v.view})),'view','count','hot')}</table></div></div></div>
<div class="two"><div><h2>Devices (people)</h2><div class="card"><table>${bars(s.devices.map(d=>({label:d.platform+' · '+d.device,users:d.users})),'label','users')}</table></div></div>
<div><h2>Roles (people)</h2><div class="card"><table>${bars(s.roles.map(d=>({label:d.role,users:d.users})),'label','users','hot')}</table></div></div>
<div><h2>App versions (people)</h2><div class="card"><table>${bars(s.versions.map(d=>({label:d.ver||'unknown',users:d.users})),'label','users')}</table></div></div></div>
<p class="note" style="margin-top:20px">Only simple events are stored: which screen, which button, app version, device type and role. Notes and records are never stored here. People can switch it off in Settings, Help and your data.</p>`}
function rng(){$('#rng').innerHTML=[7,30,90].map(n=>`<button data-d="${n}" class="${n===days?'on':''}">${n} days</button>`).join('');document.querySelectorAll('#rng button').forEach(b=>b.onclick=()=>{days=+b.dataset.d;rng();load()})}
async function go(){const r=await sb.auth.getSession();if(r.data&&r.data.session){rng();load();return}
$('#m').innerHTML=`<div id="login"><h2 style="margin-top:0">Log in</h2><p class="note">Use the same email and password as Hortlog. If you use Google, open Hortlog in this browser first, then come back to this page.</p><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><p class="err" id="er"></p><button class="btn" id="go">Log in</button></div>`;
$('#go').onclick=async()=>{const x=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(x.error)$('#er').textContent=x.error.message;else go()}}
go();
</script></body></html>
